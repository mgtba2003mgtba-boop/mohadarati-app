publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  supabase_flutter: ^2.8.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  qr_flutter: ^4.1.0
  cached_network_image: ^3.4.1
  intl: ^0.20.3
  file_picker: ^13.1.0
  http: ^1.6.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
