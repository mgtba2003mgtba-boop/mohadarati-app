<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="محاضراتي">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>محاضراتي</title>
  <link rel="manifest" href="manifest.json">
</head>
  <style>
    #pwa-install-banner {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 420px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 18px;
      padding: 12px 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(59, 130, 246, 0.2);
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 999999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif;
      direction: rtl;
      color: #fff;
      animation: pwaSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes pwaSlideUp {
      from { transform: translate(-50%, 40px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
    .pwa-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }
    .pwa-icon {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      flex-shrink: 0;
    }
    .pwa-text {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pwa-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #F8FAFC;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }
    .pwa-desc {
      font-size: 11px;
      color: #94A3B8;
      margin-top: 2px;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }
    .pwa-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .pwa-install-btn {
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
    }
    .pwa-install-btn:active {
      transform: scale(0.96);
    }
    .pwa-close-btn {
      background: transparent;
      border: none;
      color: #64748B;
      font-size: 16px;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pwa-close-btn:hover {
      color: #CBD5E1;
    }
  </style>

  <div id="pwa-install-banner">
    <div class="pwa-info">
      <img src="icons/Icon-192.png" alt="محاضراتي" class="pwa-icon">
      <div class="pwa-text">
        <span class="pwa-title">تطبيق محاضراتي</span>
        <span class="pwa-desc">تثبيت كأيقونة مع تحديثات تلقائية</span>
      </div>
    </div>
    <div class="pwa-actions">
      <button id="pwa-install-action" class="pwa-install-btn">
        <span>تثبيت</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button id="pwa-close-action" class="pwa-close-btn" aria-label="إغلاق">✕</button>
    </div>
  </div>

  <script>
    (function() {
      let deferredPrompt = null;
      const banner = document.getElementById('pwa-install-banner');
      const installBtn = document.getElementById('pwa-install-action');
      const closeBtn = document.getElementById('pwa-close-action');

      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || 
                           window.navigator.standalone === true || 
                           document.referrer.includes('android-app://');

      if (!isStandalone) {
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          deferredPrompt = e;
          if (banner && !sessionStorage.getItem('pwa_dismissed')) {
            banner.style.display = 'flex';
          }
        });

        if (installBtn) {
          installBtn.addEventListener('click', async function() {
            if (deferredPrompt) {
              deferredPrompt.prompt();
              const choice = await deferredPrompt.userChoice;
              if (choice && choice.outcome === 'accepted') {
                banner.style.display = 'none';
              }
              deferredPrompt = null;
            } else {
              alert('لتثبيت التطبيق على جهازك:\nاضغط على قائمة المتصفح (⋮) في الأعلى واختر "تثبيت التطبيق" أو "إضافة إلى الشاشة الرئيسية".');
            }
          });
        }

        if (closeBtn) {
          closeBtn.addEventListener('click', function() {
            banner.style.display = 'none';
            sessionStorage.setItem('pwa_dismissed', 'true');
          });
        }
      }

      window.addEventListener('appinstalled', function() {
        if (banner) banner.style.display = 'none';
      });
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
