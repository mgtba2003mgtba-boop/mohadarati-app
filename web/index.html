<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="منظومة بوابة الطالب الأكاديمية - الجامعة الوطنية للعلوم والتكنولوجيا (NUST)">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="محاضراتي">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>محاضراتي</title>
  <link rel="manifest" href="manifest.json">
</head>
  <style>
    html, body, flt-glass-pane, flutter-view {
      overscroll-behavior-y: none !important;
      overscroll-behavior-x: none !important;
      overscroll-behavior: none !important;
      -webkit-overscroll-behavior: none !important;
      overflow: hidden !important;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    #pwa-install-banner {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 420px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(27, 63, 182, 0.4);
      border-radius: 18px;
      padding: 12px 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(27, 63, 182, 0.25);
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 999999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif;
      direction: rtl;
      color: #fff;
      animation: pwaSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes pwaSlideUp {
      from { transform: translate(-50%, 40px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
    .pwa-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }
    .pwa-icon {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      flex-shrink: 0;
    }
    .pwa-text {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pwa-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #F8FAFC;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }
    .pwa-desc {
      font-size: 11px;
      color: #94A3B8;
      margin-top: 2px;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }
    .pwa-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .pwa-install-btn {
      background: linear-gradient(135deg, #1B3FB6, #122C82);
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 2px 8px rgba(27, 63, 182, 0.4);
      transition: all 0.2s ease;
    }
    .pwa-install-btn:active {
      transform: scale(0.96);
    }
    .pwa-close-btn {
      background: transparent;
      border: none;
      color: #64748B;
      font-size: 16px;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pwa-close-btn:hover {
      color: #CBD5E1;
    }
  </style>

  <div id="pwa-install-banner">
    <div class="pwa-info">
      <img src="icons/Icon-192.png" alt="محاضراتي" class="pwa-icon">
      <div class="pwa-text">
        <span class="pwa-title">تطبيق محاضراتي</span>
        <span class="pwa-desc">تثبيت كأيقونة مع تحديثات تلقائية</span>
      </div>
    </div>
    <div class="pwa-actions">
      <button id="pwa-install-action" class="pwa-install-btn">
        <span>تثبيت</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button id="pwa-close-action" class="pwa-close-btn" aria-label="إغلاق">✕</button>
    </div>
  </div>

  <script>
    (function() {
      let deferredPrompt = null;
      const banner = document.getElementById('pwa-install-banner');
      const installBtn = document.getElementById('pwa-install-action');
      const closeBtn = document.getElementById('pwa-close-action');

      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || 
                           window.navigator.standalone === true || 
                           document.referrer.includes('android-app://');

      if (!isStandalone) {
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          deferredPrompt = e;
          if (banner && !sessionStorage.getItem('pwa_dismissed')) {
            banner.style.display = 'flex';
          }
        });

        if (installBtn) {
          installBtn.addEventListener('click', async function() {
            if (deferredPrompt) {
              deferredPrompt.prompt();
              const choice = await deferredPrompt.userChoice;
              if (choice && choice.outcome === 'accepted') {
                banner.style.display = 'none';
              }
              deferredPrompt = null;
            } else {
              alert('لتثبيت التطبيق على جهازك:\nاضغط على قائمة المتصفح (⋮) في الأعلى واختر "تثبيت التطبيق" أو "إضافة إلى الشاشة الرئيسية".');
            }
          });
        }

        if (closeBtn) {
          closeBtn.addEventListener('click', function() {
            banner.style.display = 'none';
            sessionStorage.setItem('pwa_dismissed', 'true');
          });
        }
      }

      window.addEventListener('appinstalled', function() {
        if (banner) banner.style.display = 'none';
      });
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- حارس التحديث الإجباري التلقائي للآيفون والمتصفحات (Instant Cache Breaker) -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <script>
    (function() {
      // 1. إلغاء أي Service Worker قديم لمنع تعليق الملفات في كاش المتصفح
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        });
      }

      // دالة لتفريغ كاش المتصفح فورياً وإعادة تحميل الصفحة بنسخة جديدة قسرياً
      function forcePurgeAndReload(newBuild) {
        if (window.location.search && window.location.search.indexOf(newBuild) !== -1) {
          return;
        }
        try {
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(name) { caches.delete(name); });
            });
          }
          localStorage.setItem('nust_build_number', newBuild);
        } catch (_) {}
        var cleanUrl = window.location.origin + window.location.pathname + '?_v=' + newBuild;
        window.location.replace(cleanUrl);
      }

      // فحص رقم البناء في السيرفر ومقارنته مع المحفوظ في جهاز الطالب
      function checkServerBuild() {
        fetch('/version.json?_t=' + Date.now(), { cache: 'no-store' })
          .then(function(res) { return res.json(); })
          .then(function(data) {
            if (data && data.build_number) {
              var current = localStorage.getItem('nust_build_number');
              if (current && current !== String(data.build_number)) {
                console.log('[*] New build detected:', data.build_number, 'Replacing current:', current);
                forcePurgeAndReload(data.build_number);
              } else if (!current) {
                localStorage.setItem('nust_build_number', String(data.build_number));
              }
            }
          })
          .catch(function(err) {
            console.warn('[-] Version check skipped:', err);
          });
      }

      // تنفيذ الفحص الفوري عند بدء تشغيل الصفحة
      checkServerBuild();

      // الاستماع لحدث العودة للتطبيق (عند فتح الآيفون أو الرجوع من تطبيق آخر)
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          checkServerBuild();
        }
      });
      window.addEventListener('pageshow', function() {
        checkServerBuild();
      });
    })();
  </script>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- نظام الإشعارات والتنبيهات المباشرة للآيفون والأندرويد (Web Push Bridge) -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <script>
    window.requestAppNotificationPermission = async function() {
      if (!('Notification' in window)) {
        console.warn('Notifications not supported in this environment');
        return false;
      }
      try {
        const permission = await Notification.requestPermission();
        return permission === 'granted';
      } catch (err) {
        console.error('Error requesting notification permission:', err);
        return false;
      }
    };

    window.getNotificationPermissionStatus = function() {
      if (!('Notification' in window)) return 'unsupported';
      return Notification.permission;
    };

    window.showNativeNotification = function(title, body, tag, url) {
      if (!('Notification' in window)) return;
      if (Notification.permission !== 'granted') return;

      try {
        const options = {
          body: body || '',
          icon: '/icons/Icon-192.png',
          badge: '/icons/Icon-192.png',
          tag: tag || ('nust_' + Date.now()),
          renotify: true,
          vibrate: [200, 100, 200]
        };
        const notif = new Notification(title, options);
        notif.onclick = function() {
          window.focus();
          if (url && window.location.hash !== url) {
            window.location.href = url;
          }
          notif.close();
        };
      } catch (e) {
        if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
          navigator.serviceWorker.ready.then(function(reg) {
            reg.showNotification(title, {
              body: body || '',
              icon: '/icons/Icon-192.png',
              badge: '/icons/Icon-192.png',
              tag: tag || ('nust_' + Date.now())
            });
          }).catch(function(_) {});
        }
      }
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
