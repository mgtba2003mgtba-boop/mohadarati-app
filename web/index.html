  <!-- درع الحماية والمراقبة اللحظية (Zero-White-Screen Watchdog)       -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <script>
    (function() {
      window._fltRendered = false;
      var hasFatalError = false;
      var fatalErrorMessage = '';

      var ua = navigator.userAgent || '';
      var isInApp = /Telegram|FBAN|FBAV|Instagram|musical_ly|TikTok|wv/i.test(ua);
      var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);

      var hasWasm = false;
      try {
        hasWasm = typeof WebAssembly === 'object' && typeof WebAssembly.instantiate === 'function';
      } catch (_) {}

      var hasWebGL = false;
      try {
        var canvas = document.createElement('canvas');
        hasWebGL = !!(canvas.getContext('webgl2') || canvas.getContext('webgl') || canvas.getContext('experimental-webgl'));
      } catch (_) {}

      window.addEventListener('error', function(e) {
        if (!window._fltRendered) {
          hasFatalError = true;
          fatalErrorMessage = (e && e.message) || 'Error loading application assets';
          console.warn('[Watchdog Captured Error]:', fatalErrorMessage);
        }
      });

      window.addEventListener('unhandledrejection', function(e) {
        if (!window._fltRendered) {
          hasFatalError = true;
          fatalErrorMessage = (e && e.reason && e.reason.message) || String(e ? e.reason : 'Rejection');
          console.warn('[Watchdog Captured Rejection]:', fatalErrorMessage);
        }
      });

      window.addEventListener('flutter-first-frame', function() {
        window._fltRendered = true;
        var bar = document.getElementById('in-app-browser-bar');
        if (bar && !isInApp) bar.style.display = 'none';
        var card = document.getElementById('client-recovery-card');
        if (card) card.style.display = 'none';
      });

      window.triggerEmergencyRecovery = function(reason) {
        if (window._fltRendered) return;
        var fltView = document.querySelector('flutter-view') || document.querySelector('flt-glass-pane');
        if (fltView && (fltView.shadowRoot || fltView.children.length > 0)) return;

        var card = document.getElementById('client-recovery-card');
        var desc = document.getElementById('crc-desc-text');
        if (card && desc) {
          if (!hasWebGL) {
            desc.innerText = 'محرك الرسوميات (WebGL) غير مفعل أو محجوب في هذا المتصفح. اضغط أدناه لفتح الرابط عبر متصفح Chrome أو Safari الأصلي مباشرة.';
          } else if (!hasWasm) {
            desc.innerText = 'هذا المتصفح لا يدعم تقنية WebAssembly. يرجى التحديث أو استخدام متصفح حديث.';
          } else if (isInApp) {
            desc.innerText = 'يبدو أن متصفح التطبيق الداخلي يعيق تهيئة الصفحة. اضغط أدناه لفتح المنظومة في متصفحك الأساسي فوراً.';
          } else if (reason) {
            desc.innerText = 'حدث بطء في شبكة الاتصال أو تعذر اكتمال تحميل ملفات المنظومة: ' + reason;
          }
          card.style.display = 'flex';
        }
      };

      setTimeout(function() {
        if (!window._fltRendered) {
          if (!hasWebGL || !hasWasm || hasFatalError) {
            window.triggerEmergencyRecovery(fatalErrorMessage || 'Incompatible Environment');
          } else {
            setTimeout(function() {
              if (!window._fltRendered) {
                window.triggerEmergencyRecovery('Connection Timeout');
              }
            }, 6000);
          }
        }
      }, 9000);

      window.openInExternalBrowser = function() {
        if (isAndroid) {
          var cleanHost = window.location.host + window.location.pathname + window.location.search;
          window.location.href = 'intent://' + cleanHost + '#Intent;scheme=https;package=com.android.chrome;end';
        } else if (isIOS) {
          alert('لتجربة سريعة وتثبيت التطبيق:\nاضغط على زر (•••) في الزاوية، ثم اختر "فتح في Safari" (Open in Safari).');
        } else {
          window.open(window.location.href, '_blank');
        }
      };

      window.dismissInAppNotice = function() {
        var bar = document.getElementById('in-app-browser-bar');
        if (bar) bar.style.display = 'none';
        try { sessionStorage.setItem('iab_dismissed', '1'); } catch (_) {}
      };

      document.addEventListener('DOMContentLoaded', function() {
        if (isInApp && !sessionStorage.getItem('iab_dismissed')) {
          var bar = document.getElementById('in-app-browser-bar');
          if (bar) bar.style.display = 'flex';
        }
        if (!hasWebGL || !hasWasm) {
          setTimeout(function() {
            window.triggerEmergencyRecovery();
          }, 1200);
        }
      });
    })();
  </script>

  <script>
    (function() {
      let deferredPrompt = null;
      const banner = document.getElementById('pwa-install-banner');
      const installBtn = document.getElementById('pwa-install-action');
      const closeBtn = document.getElementById('pwa-close-action');

      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || 
                           window.navigator.standalone === true || 
                           document.referrer.includes('android-app://');

      if (!isStandalone) {
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          deferredPrompt = e;
          if (banner && !sessionStorage.getItem('pwa_dismissed')) {
            banner.style.display = 'flex';
          }
        });

        if (installBtn) {
          installBtn.addEventListener('click', async function() {
            if (deferredPrompt) {
              deferredPrompt.prompt();
              const choice = await deferredPrompt.userChoice;
              if (choice && choice.outcome === 'accepted') {
                banner.style.display = 'none';
              }
              deferredPrompt = null;
            } else {
              alert('لتثبيت التطبيق على جهازك:\nاضغط على قائمة المتصفح (⋮) في الأعلى واختر "تثبيت التطبيق" أو "إضافة إلى الشاشة الرئيسية".');
            }
          });
        }

        if (closeBtn) {
          closeBtn.addEventListener('click', function() {
            banner.style.display = 'none';
            sessionStorage.setItem('pwa_dismissed', 'true');
          });
        }
      }

      window.addEventListener('appinstalled', function() {
        if (banner) banner.style.display = 'none';
      });
    })();
  </script>

  <!-- حارس التحديث الإجباري التلقائي للآيفون والمتصفحات (Instant Cache Breaker) -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <script>
    (function() {
      // 1. إلغاء أي Service Worker قديم لمنع تعليق الملفات في كاش المتصفح
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        });
      }

      // دالة لتفريغ كاش المتصفح فورياً وإعادة تحميل الصفحة بنسخة جديدة قسرياً
      window.forcePurgeAndReload = function(newBuild) {
        newBuild = newBuild || Date.now();
        if (window.location.search && window.location.search.indexOf(newBuild) !== -1) {
          return;
        }
        try {
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(name) { caches.delete(name); });
            });
          }
          localStorage.setItem('nust_build_number', newBuild);
        } catch (_) {}
        var cleanUrl = window.location.origin + window.location.pathname + '?_v=' + newBuild;
        window.location.replace(cleanUrl);
      };
      var forcePurgeAndReload = window.forcePurgeAndReload;

      // فحص رقم البناء في السيرفر ومقارنته مع المحفوظ في جهاز الطالب
      function checkServerBuild() {
        fetch('/version.json?_t=' + Date.now(), { cache: 'no-store' })
          .then(function(res) { return res.json(); })
          .then(function(data) {
            if (data && data.build_number) {
              var current = localStorage.getItem('nust_build_number');
              if (current && current !== String(data.build_number)) {
                console.log('[*] New build detected:', data.build_number, 'Current registered:', current);
                // حفظ رقم البناء الأحدث بسلاسة دون إعادة تحميل الصفحة أثناء عمل المستخدم
                localStorage.setItem('nust_build_number', String(data.build_number));
              } else if (!current) {
                localStorage.setItem('nust_build_number', String(data.build_number));
              }
            }
          })
          .catch(function(err) {
            console.warn('[-] Version check skipped:', err);
          });
      }

      // تنفيذ الفحص لمرة واحدة بهدوء عند بدء تشغيل الصفحة
      checkServerBuild();
    })();
  </script>

  <script>
    window.requestAppNotificationPermission = async function() {
      if (!('Notification' in window)) {
        console.warn('Notifications not supported in this environment');
        return false;
      }
      try {
        const permission = await Notification.requestPermission();
        return permission === 'granted';
      } catch (err) {
        console.error('Error requesting notification permission:', err);
        return false;
      }
    };

    window.getNotificationPermissionStatus = function() {
      if (!('Notification' in window)) return 'unsupported';
      return Notification.permission;
    };

    window.showNativeNotification = function(title, body, tag, url) {
      if (!('Notification' in window)) return;
      if (Notification.permission !== 'granted') return;

      try {
        const options = {
          body: body || '',
          icon: '/icons/Icon-192.png',
          badge: '/icons/Icon-192.png',
          tag: tag || ('nust_' + Date.now()),
          renotify: true,
          vibrate: [200, 100, 200]
        };
        const notif = new Notification(title, options);
        notif.onclick = function() {
          window.focus();
          if (url && window.location.hash !== url) {
            window.location.href = url;
          }
          notif.close();
        };
      } catch (e) {

            reg.showNotification(title, {
              body: body || '',
              icon: '/icons/Icon-192.png',
              badge: '/icons/Icon-192.png',
              tag: tag || ('nust_' + Date.now())
            });
          }).catch(function(_) {});
        }
      }
    };
  </script>
